# Window side lengths in pixels. Restart Countdown after configuration changes.
size_px = 220
compact_size_px = 32

[notifications]

# A number repeats at that interval, rounded to the nearest 5 (minimum 5).
# An array sets exact remaining-minute marks: [1, 5, 15, 30, 45].
# Array entries must be nonnegative integers; [] leaves only end/phase notifications.
# Notifications count backwards from the active end time, including zero.
notification_marks_minutes = 15

# Seconds the centered minutes stay visible between fades.
notification_hold_time_seconds = 5

# Duration of each fade, in seconds. Zero disables fades.
notification_fade_time_seconds = 0.8 

# Fade curves: "linear", "ease-in", "ease-out", "ease-in-out".
# linear: constant speed; ease-in: slow start; ease-out: slow finish.
# ease-in-out: slow start and finish. Invalid values use the defaults below.
# These defaults reduce the time near peak opacity when the hold time is zero.
notification_fade_in = "ease-in"
notification_fade_out = "ease-out"

notification_font = "SFPro-Regular"
notification_font_size_pt = 600
notification_font_alpha = 0.8        # From 0 (invisible) to 1 (fully opaque).


# Optional variable-font axes. Font specific properties and values.
notification_font_weight = 600
notification_font_width = 1000
# notification_font_optical_size_pt = 28    # SF Pro: 17 to 28, normal = 28
# notification_font_slant_degrees = -10     # Monaspace: 0 = upright; negative values lean right

[alarm]
alarm_audio = "alarm.mp3"
# Replaces 0 at timeout when the alarm is enabled. Empty or absent means 0.
alarm_message = "DONE"

[pomodoro]
focus = 25          # minutes
rest = 5            # minutes
long-rest = 20      # minutes
cycles = 7          # 1 to 15
